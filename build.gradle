plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.10"
	id "com.gradleup.shadow" version "9.2.2"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Added repositories for Cloth Config and ModMenu
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url 'https://jitpack.io' }
}

// Game tests live in their own source set so they stay out of the shipped jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sniffer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"sniffer-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			configName = "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${projectDir}/build/gametest-results.xml"
			runDir "build/gametest"
		}
	}

//	log4jConfigs.from(file("log4j.xml"))

}

configurations {
	shadowImpl
	// Mockito must be loaded as a JVM agent: self-attach is disabled on Java 25.
	mockitoAgent
}

configurations.shadowImpl.extendsFrom(configurations.implementation)

dependencies {
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
	testImplementation "org.mockito:mockito-core:5.20.0"
	mockitoAgent("org.mockito:mockito-core:5.20.0") { transitive = false }

	implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'
	implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.debug:0.24.0'
	implementation 'jakarta.websocket:jakarta.websocket-api:2.2.0'
	implementation 'org.glassfish.tyrus:tyrus-server:2.2.0'
	implementation 'org.glassfish.tyrus:tyrus-container-grizzly-server:2.2.0'
	implementation 'io.methvin:directory-watcher:0.19.1'

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Added Cloth Config and ModMenu
	api("me.shedaniel.cloth:cloth-config-fabric:26.2.155") {
		exclude(group: "net.fabricmc.fabric-api")
	}
    implementation("com.terraformersmc:modmenu:20.0.1")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 25
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.named("test") {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}


tasks.named("shadowJar") {
	archiveClassifier.set("all")
	from(sourceSets.main.output)
	from(sourceSets.client.output)
	configurations = [project.configurations.shadowImpl]
}

tasks.build { dependsOn(tasks.shadowJar) }

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	accessWidenerPath = file("src/main/resources/sniffer.accesswidener")
}

// Applied at the end: in the plugins block, JaCoCo resolves repositories before
// Loom has finished registering its own, which breaks the Minecraft setup.
apply plugin: 'jacoco'

// The game tests exercise the mixin layer, which the JUnit run never loads,
// so the headless run is instrumented too and both traces feed one report.
jacoco.applyTo(tasks.named('runGametest').get())

tasks.named('runGametest') {
	// The JaCoCo trace is an output, which would otherwise let Gradle skip the run.
	outputs.upToDateWhen { false }
	jacoco {
		destinationFile = layout.buildDirectory.file('jacoco/runGametest.exec').get().asFile
	}
}

// Reports both runs, so it launches the game: `./gradlew jacocoTestReport`.
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test'), tasks.named('runGametest')
	// Whichever traces exist: `test` alone still reports, `runGametest test` reports both.
	executionData.setFrom(files(
		layout.buildDirectory.file('jacoco/test.exec'),
		layout.buildDirectory.file('jacoco/runGametest.exec'),
	).filter { it.exists() })
	reports {
		html.required = true
		xml.required = true
	}
	// Mixins and accessors only ever run inside a launched game, so they can
	// never be covered here and would just drag the numbers down.
	classDirectories.setFrom(
		sourceSets.main.output.asFileTree.matching {
			exclude 'dev/mcbookshelf/sniffer/mixin/**'
			exclude 'dev/mcbookshelf/sniffer/accessor/**'
		}
	)
}