name: 🛠️ Task or Improvement
description: Request a specific task or improvement to be done.
type: 🛠️ Task
body:
  - type: dropdown
    attributes:
      label: 🗂️ Task Type
      description: |
        What kind of task is this?
      options:
        - ⚡ Enhancement
        - 📚 Documentation
        - 🧪 Tests
        - ⚙️ Automation
        - 🏷️ Metadata
        - 🆙 Minecraft version bump
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📝 Description
      description: |
        What needs to be done? Be as specific as possible:
        - What is the goal of the task?
        - Why is it needed?
        - Any relevant context?
      placeholder: |
        Examples:
        - Document the breakpoint kinds supported by the VS Code extension.
        - Add a game test covering the scope pop on an early `/return`.
    validations:
      required: true
