# Documentation tooling only: the mod itself is built with Gradle.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniffer-docs"
version = "0"
requires-python = ">=3.13"

[project.scripts]
docs = "docs_cli:docs"

[dependency-groups]
docs = [
  "linkify-it-py>=2.1.0",
  "myst-parser>=5.1.0",
  "sphinx>=9.1.0",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-breeze-theme>=0.13.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
  "sphinx-minecraft>=1.0.5",
]

[tool.hatch.build.targets.wheel]
only-include = ["scripts/docs_cli.py"]
sources = ["scripts"]

[tool.uv]
default-groups = "all"
